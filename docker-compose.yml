services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sql-rule-engine-api
    ports:
      - "8000:8000"
    # Load secrets (JWT_SECRET, JWT_REFRESH_SECRET, TTLs, ...) from .env.
    # The inline `environment:` below overrides any conflicting keys (PORT,
    # DATABASE_URL, REDIS_URL) so the container uses the internal network.
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sqlruleengine
      SANDBOX_DATABASE_URL: postgresql://sandbox_ro:sandbox_ro@postgres:5432/sqlruleengine
      REDIS_URL: redis://redis:6379
    command: >
      sh -c "pnpm db:migrate &&
             node ./dist/db/seed.js &&
             node ./dist/db/setup-sandbox-role.js &&
             node ./dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sql-engine-network

  postgres:
    image: postgres:16-alpine
    container_name: sql-engine-db
    ports:
      # host :5432 is already in use locally, so expose on :5434 (app still
      # reaches Postgres via the internal network at postgres:5432)
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqlruleengine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlruleengine"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sql-engine-network

  redis:
    image: redis:7-alpine
    container_name: sql-engine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sql-engine-network

volumes:
  postgres_data:
  redis_data:

networks:
  sql-engine-network:
    driver: bridge
